[versions]
spring-boot = "4.1.0"
spring-modulith = "2.1.0"
flyway = "13.2.0"
postgresql = "42.7.13"
testcontainers = "1.21.4"
junit = "6.1.3"
assertj = "3.27.7"
archunit = "1.5.0"
jspecify = "1.0.1"
nullaway = "0.13.8"
errorprone = "2.50.0"

[libraries]
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-modulith-bom = { module = "org.springframework.modulith:spring-modulith-bom", version.ref = "spring-modulith" }

flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }
# archunit nucleo, no archunit-junit5: las reglas se escriben como pruebas JUnit
# normales y asi no dependemos de que su motor siga a la version de JUnit.
archunit = { module = "com.tngtech.archunit:archunit", version.ref = "archunit" }

# Nulidad (ARQ-04 §4): JSpecify son las anotaciones, NullAway el que las revisa.
# Sin el segundo, las anotaciones son documentacion y nada mas.
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }

testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql" }
testcontainers-junit = { module = "org.testcontainers:junit-jupiter" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
