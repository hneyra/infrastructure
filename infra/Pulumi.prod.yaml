# Stack de producción: el VPS que atiende a la municipalidad (INF-01 §1).
#
# Aquí solo hay valores en claro. Los secretos de arranque de la infraestructura
# —kubeconfig y credenciales del almacenamiento de respaldo— NO se versionan en este
# archivo, ni siquiera cifrados (`stacks.test.ts`: "ningun stack versiona un secreto en
# claro"): `pulumi config set --secret` escribe en la copia efímera del checkout, nunca
# en git. Los de la aplicación —incluida la clave del administrador de Keycloak— no
# están en Pulumi en absoluto (ADR-0011 §3, issue #154): los genera
# `secretos/bootstrap-secretos.sh`.
#
# CI los inyecta frescos en cada corrida desde los secretos `KUBECONFIG`/
# `BACKUP_ACCESS_KEY_ID`/`BACKUP_SECRET_ACCESS_KEY` del *environment* `prod` de GitHub
# (`.github/workflows/infra.yml`, paso "Configurar los secretos de infraestructura del
# stack"). Localmente, antes de `preview`/`up`, hay que correr:
#
#   pulumi config set --secret kubeconfig "$(cat k3s.yaml)" --stack prod
#   pulumi config set --secret backupAccessKeyId <valor> --stack prod
#   pulumi config set --secret backupSecretAccessKey <valor> --stack prod
#
# y NUNCA `git add` el resultado — es exactamente lo que la prueba detecta si se cuela.
#
# El `server` del kubeconfig tiene que ser `https://localhost:6443`: CI llega por un
# túnel SSH y `config.ts` se pone rojo si apunta al VPS (INF-01 §1.4).
config:
  # Lo ASIGNABLE del nodo, medido — no su capacidad (`capacidad.ts`).
  #
  # MEDIDO SOBRE `vmd206041` EL 2026-09-11, por el tunel SSH y DESPUES de aplicar la reserva:
  #
  #   CAPACIDAD   cpu=6  mem=12242280Ki
  #   ASIGNABLE   cpu=5  mem=10145128Ki
  #
  # La diferencia es exactamente 1 CPU y 2 097 152 Ki = 2 Gi, que es lo que
  # `reservar-recursos-del-nodo.sh` reparte entre sus dos partidas —500m + 1Gi en
  # `system-reserved`, otro tanto en `kube-reserved`, y kubelet las SUMA—. Comprobado en el
  # `configz` del kubelet, no deducido de la resta.
  #
  # ⚠ El nodo es un 6 CPU / ~11,7 GB, NO el 8 CPU / 16 GB que `INF-01` §2 dimensiona: es del
  # mismo tamano que `stg`. Y con eso el stack CABE — pico 2360m / 9440Mi contra 4800m / 9747Mi
  # disponibles (lo asignable menos los 200m/160Mi de los pods de serie de k3s), o sea 2440m y
  # 307Mi de margen. Ese margen de memoria es fino en PETICIONES y no en uso: la volumetria de
  # `stg` del 2026-09-11 mide ~132m / ~2,4 Gi de consumo real contra 1540m / 5536Mi pedidos.
  #
  # La reserva se corrio el 2026-09-11 con el nodo vacio y antes del primer `pulumi up`, que es
  # su ventana barata: lo asignable bajo, la capacidad no, y ningun pod se cayo. Queda anotado
  # AQUI porque el runbook al que el guion remite —`docs/80-infraestructura/mantenimiento-del-
  # nodo.md`— NO EXISTE en este repositorio.
  #
  # Y hay que decir lo que cuesta: la reserva de MEMORIA son 2 Gi, el doble del «~1 GB» que
  # `INF-01` §2 dimensiona. No es un despiste —el propio guion lo mide: «solo el API server
  # ronda el medio giga, y el sistema operativo con containerd completan el resto»— pero es la
  # mitad del margen que se va, y es de donde sale que queden 307Mi en vez de 2 355Mi.
  #
  # ── EL NODO ANTERIOR, que NO se reescribe porque es la medicion que se hizo ──
  #
  # `vmd120205` era un 4 CPU / 8 GB, y la reserva del issue #157 se le aplico el 2026-08-23
  # DUPLICADA —1 CPU y 1 Gi en CADA partida, o sea 2 CPU y 2 Gi—, dejandolo en 2 CPU y
  # 6 029 348 Ki asignables (INF-10 §4). Desde ese dia `prod` no podia ubicar su propio stack, y
  # eso es lo que la brecha de #1 declaraba.
  #
  # Y ya se equivoco una vez en la direccion contraria: el 2026-08-26 se declaro "3" —lo que el
  # nodo daria una vez corregida la reserva— y `aplicar-prod` se detuvo en «Lo declarado cabe en
  # el nodo real», que existe justo para eso. Declarar por DEBAJO de lo real esta admitido y solo
  # aprieta la comprobacion; declarar de MAS es lo unico que se rechaza. Adelantarse al nodo no
  # despliega nada: solo cambia el paso en el que falla.
  #
  # Volver a medirlo despues de tocar el nodo o la reserva:
  #   kubectl get node -o jsonpath='{.items[0].status.allocatable.cpu}{"/"}{.items[0].status.allocatable.memory}'
  kamayuk:nodeAllocatableCpu: "5"
  kamayuk:nodeAllocatableMemory: 10145128Ki
  #
  # LA BRECHA DE #1 SE RETIRO el 2026-09-11, y el orden es lo que la hizo retirable: primero se
  # aplico la reserva, luego se midio, luego se escribio lo medido, y solo entonces salio esta
  # linea. Lo que habia aqui era:
  #
  #   kamayuk:nodeCapacityGapIssue: "1"
  #
  # No se retira «porque ya deberia caber»: se retira porque `yarn capacidad --ambiente prod`
  # dice `cabe` con las dos cifras de arriba. Y no habia que acordarse — `capacidad.test.ts`
  # exige que quien declara la brecha SIGA sin caber, asi que se pone roja sola en cuanto quepa.
  #
  # Cuanto pide este ambiente sobre su nodo (C-19). `dimensionado` es la tabla de INF-01 §2,
  # que es la que este archivo ha usado siempre: esta linea NO cambia una sola peticion de
  # `prod` — se comprobo comparando `yarn manifiestos --ambiente prod` byte a byte antes y
  # despues, y una prueba fija las dos cifras del pico para que no pueda moverse en silencio.
  # Se declara igualmente, sin valor por omision, por lo mismo que `municipalidadId`: un
  # `?? "dimensionado"` haria que olvidarlo se leyera igual que declararlo. Y `checkInvariants`
  # RECHAZA `minimo` aqui: ese perfil es de un ambiente de ensayo.
  kamayuk:perfilDeRecursos: dimensionado
  # EL MONOLITO YA NO SE DESPLIEGA (`E`, 2026-09-06), Y AQUI ES DONDE SE NOTA.
  #
  # `stg` lo apago en C-19 y este ambiente lo seguia declarando. **Medido**, comparando
  # `yarn manifiestos --ambiente prod` antes y despues: este stack pasa de **101 a 84 objetos**,
  # y los **17** que se van son estos —los dos `Job` de arranque, el `Deployment` del perfil
  # `web`, su `Service`, la interfaz con su `ConfigMap` de nginx y su `Service`, el `CronJob` de
  # `lote`, las dos `IngressRoute` y las siete `NetworkPolicy` que seleccionaban esos pods—.
  # (`stg` pasa de 94 a 87: alli solo quedaban las siete politicas, que C-19 dejo a proposito
  # porque una politica sin pod que casar es inerte.)
  #
  # LO QUE SE PIERDE, dicho y no descubierto: con la interfaz se va **la unica interfaz web del
  # producto**. Ninguno de los cuatro sistemas tiene `frontend/` todavia, asi que la raiz del
  # dominio publico deja de servir nada y solo queda `/keycloak`. Eso no es un efecto colateral
  # que se arregle luego: es el coste de la decision, y quien la tomo lo sabe.
  #
  # Sobre el DATO: la direccion midio que este ambiente esta entero a cero —`contribuyente`,
  # `predio`, `recibo` y los asientos, todos en 0—. **Aqui no se pudo comprobar**: llegar a
  # `prod` necesita el tunel SSH, y este repositorio todavia no tiene las credenciales de ese
  # ambiente (`deteccion-de-deriva` se salta todas las noches por eso). Queda como hueco.
  #
  # Y no se retira ninguna copia: los respaldos de `sgtm-prod-respaldos` siguen donde estan, con
  # su clave de cifrado intacta (INF-08 §4). Recuperar el monolito seria recuperar los dos
  # componentes borrados de este repositorio, no volver a poner una linea.
  # EL NOMBRE DEL NODO, y de aquí cuelga más de lo que parece: el `IngressRoute`, el
  # certificado que ACME emite, el `KC_HOSTNAME` de Keycloak, los `redirectUris` y
  # `webOrigins` del realm (`Identidad.ts` los reescribe con `enElDominio()`) y —lo que más
  # pesa— **el emisor OIDC**, `https://<domain>/keycloak/realms/<realm>`
  # (`convenciones.ts:682`), que es lo que los cinco sistemas validan en cada token.
  #
  # 2026-09-11: `vmd120205.contaboserver.net` → `vmd206041.contaboserver.net`. El nodo viejo
  # es un 4 CPU / 8 GB donde el stack NO CABE desde que entró el quinto sistema (la brecha de
  # más arriba); el nuevo es el 8 CPU / 16 GB que `INF-01` §2 dimensiona y que el issue #158
  # confirmó desplegando.
  #
  # ⚠ Esto es el nombre que da el PROVEEDOR, así que la próxima mudanza vuelve a cambiar el
  # emisor de los cinco sistemas. Un nombre DNS propio y estable lo evitaría, y merece
  # decidirse antes de que haya tokens en circulación.
  #
  # ⚠ El DNS tiene que apuntar al nodo nuevo ANTES de que Traefik pida el certificado: ACME
  # resuelve el desafío HTTP-01 por el puerto 80 que abre `infra/vps/cortafuegos.sh`. Y el
  # límite de Let's Encrypt son 50 certificados por dominio registrado y semana, así que los
  # reintentos se pagan.
  kamayuk:domain: vmd206041.contaboserver.net
  # A QUIEN se le avisa cuando algo de operacion necesita una persona, y DONDE (C-7 §4).
  # El primero que lo consume es `caja`: ADR-0026 §4 exige que un pago que no se pudo imputar
  # avise a una persona CON NOMBRE, porque es dinero cobrado sin registrar. Su aplicacion NO
  # ARRANCA sin las dos, y `checkInvariants` rechaza ademas el relleno —«pendiente», «TBD»—,
  # que satisfaria esa guarda y la vaciaria de sentido.
  kamayuk:responsableDeOperacion: Equipo de operacion
  kamayuk:canalDeOperacion: operaciones@example.pe
  kamayuk:acmeEmail: operaciones@example.pe
  # Versiones fijadas. Una etiqueta móvil convierte cualquier reinicio del VPS en una
  # actualización no planificada, y en un solo nodo eso pasa en cada mantenimiento.
  kamayuk:postgresImage: postgis/postgis:16-3.4-alpine
  kamayuk:postgresStorageSize: 100Gi
  kamayuk:keycloakImage: quay.io/keycloak/keycloak:26.0
  kamayuk:keycloakRealm: kamayuk
  # SIN relay SMTP, a propósito (ADR-0012, Opción B). Esta marcha blanca no tiene un
  # relay de correo decidido (D-05), así que NO se declara `keycloakSmtpHost`: el realm
  # va sin `smtpServer`, el Job de reconciliación crea el usuario sin clave y con
  # UPDATE_PASSWORD pendiente, y un operador se la fija con el runbook «Recuperar el
  # acceso de un usuario». Cuando haya relay, se añaden aquí `keycloakSmtpHost` /
  # `keycloakSmtpPort` / `keycloakSmtpFrom` (en claro) y —si pide auth— el `Secret`
  # `kamayuk-prod-smtp` (`usuario`/`clave`), que NO genera `bootstrap-secretos.sh`
  # (INF-06 §1.2). No hace falta relanzar el alta: reenviar el enlace a cada usuario.
  # Sin etiqueta, a propósito: la pone el flujo de liberación (ADR-0011 §5, issue #148).
  kamayuk:applicationImageRepository: ghcr.io/hneyra
  # El usuario con que el nodo se autentica contra ghcr.io para traer sgtm-aplicacion,
  # sgtm-migrador y sgtm-interfaz —los tres privados—. No es secreto; lo que sí lo es
  # es `registryPullToken` (un PAT con `read:packages`), que CI inyecta igual que
  # `backupAccessKeyId` (issue #257).
  kamayuk:registryUsername: hneyra
  # Una réplica, como `stg`. Dos no caben en los ~6 GB que este nodo reparte: el pico
  # del arranque —los Deployment más los Jobs de migración e implantación, que conviven
  # con ellos durante el `pulumi up`— pedía 6 368Mi contra 5 728Mi disponibles. Con una
  # réplica son 5 344Mi, y quedan 384Mi de margen. Lo permanente son 4 256Mi: el nodo
  # queda usado al 74 % de lo que reparte, que es aprovecharlo sin apurarlo.
  #
  # Lo que se cede es la continuidad durante un despliegue, no la disponibilidad: sobre
  # un nodo único las dos réplicas caían juntas de todos modos (INF-01 §1). Se vuelve a
  # "2" cuando el nodo crezca a lo que INF-01 §2 dimensiona.
  # LA VERSION DE CADA SISTEMA, que es un `sha` de SU repositorio (D, bloqueo 1).
  #
  # Hasta hoy las ocho imagenes de los cuatro sistemas se etiquetaban con
  # `applicationBootstrapVersion`, que es un `sha` de `sgtm`: una revision que no describe este
  # codigo y que ni siquiera existe en esos clones. Medido contra ghcr.io el 2026-09-05, las ocho
  # contestaban `404 MANIFEST_UNKNOWN` — o sea que un `pulumi up` habria dejado los cuatro
  # `Deployment` y los cuatro `Job` de migracion en `ImagePullBackOff`, sin que nada lo predijera.
  #
  # Cada una es el `sha` de un commit de `main` de su repositorio cuyas dos imagenes publico
  # `publicar-imagenes.yml` (que desde hoy existe en los cuatro, y no filtra por `paths`
  # precisamente para que TODO commit de `main` tenga sus dos imagenes). Que la etiqueta exista lo
  # comprueba `yarn imagenes --ambiente <amb>` contra el registro, y que sea una revision de `main`
  # —lo unico que se puede saber sin hablar con el registro— lo comprueba
  # `verificaciones/imagenes-publicadas.test.ts` en cada corrida.
  #
  # Subir una de estas cuatro lineas NO reemplaza la imagen de un `Deployment` que ya corre
  # (ADR-0011 §5, `ignoreChanges`), pero **no es inerte**: el `Job` de migracion de ese sistema
  # lleva la version en el nombre, asi que un valor nuevo no modifica un Job — crea otro, y ese
  # Job aplica las migraciones de esa version.
  kamayuk:versionDeRentas: 66ebe547a3ee547598711e02267a1ecfea8aae14
  kamayuk:versionDeCatastro: ac1239a26fd538c852fdc0d204dafa3d8b69cda9
  kamayuk:versionDeNormativa: e1cdad5a3e4fdfd508144a67eaa569aa9488b80f
  kamayuk:versionDeCaja: 0772e2515a68d4e659b129c057067eb88f254370
  # El quinto (ADR-0039). Es el `sha` de `main` de `hneyra/identidad` —su etapa 1 se integro
  # como `89eca30`—, medido con `git -C ../identidad rev-parse origin/main` y no tecleado:
  # cuarenta caracteres hexadecimales inventados pasan la comprobacion de forma, y lo que
  # `deriva-de-migraciones` exige es que la revision este en la historia de `origin/main`,
  # porque `publicar-imagenes.yml` solo publica al integrar. **Lo que esta linea NO demuestra
  # es que las dos imagenes esten en el registro**: eso lo pregunta `yarn imagenes --ambiente
  # <amb>`, que necesita red y credencial y sin ella sale con codigo 3 — nunca en verde.
  kamayuk:versionDeIdentidad: a0866be2295467bf392e747eae3678967ad5d0f9
  # La versión con la que Pulumi CREA los despliegues. El campo `image` de los tres
  # `Deployment` queda ignorado después (ADR-0011 §5), así que subir esta línea **no**
  # reemplaza la imagen de un `Deployment` que ya corre: eso lo hace el flujo de
  # liberación con `kubectl set image`.
  #
  # **Pero no es inerte sobre un clúster en marcha, y creerlo cuesta caro.** Los dos
  # Jobs de arranque llevan la versión EN EL NOMBRE (`sufijoDeVersion()`,
  # `componentes/Migracion.ts`), así que un valor nuevo no modifica un Job: crea otro.
  # Subir esta línea es, literalmente, «corre el migrador de esa versión contra esta
  # base y vuelve a implantar la municipalidad». Comprobado sin desplegar:
  #
  #   yarn --silent manifiestos --ambiente prod | grep migracion
  #   # con 0eee58e: Job/sgtm-prod-migracion-0eee58e43e04
  #   # con 5fc02f3: Job/sgtm-prod-migracion-5fc02f3a4493
  #
  # Por eso el orden del runbook de liberación —primero el Job de migración, después la
  # imagen— no es una recomendación: es lo que esta línea dispara sola.
  #
  # **Y por eso queda desactualizarla.** El síntoma de dejarla vieja no es un error: es
  # una carga que termina en verde y no escribe nada, porque la clase batch que se
  # invoca no existe en esa imagen y Spring arranca con el contexto vacío y sale con
  # código 0 (PR #244, medido en `stg` con `cargar-catalogo-vial.sh`). Medido aquí el
  # 2026-08-29, antes de subirla: el clúster de `prod` corría `0eee58e` (2026-08-27) y
  # su base tenía **27 migraciones aplicadas** donde `main` declara **48** —de `V28`
  # (notificación y pase a coactiva) a `V57` (depreciación por uso)—, así que ni las
  # tres tablas de valuación nacionales de `V55` ni la columna de uso de `V57` existían
  # en producción, y `publicar-cuadros.sh` no tenía dónde escribir.
  #
  # Se sube al último `sha` de `main` con `publicar-imagenes.yml` en verde —el flujo
  # publica las tres imágenes etiquetadas por commit, nunca `latest`—, confirmado con:
  #
  #   gh run list --workflow publicar-imagenes.yml --limit 5 \
  #     --json headSha,conclusion,createdAt
  #
  # `5fc02f3` (2026-08-29T20:51Z, `success` en los tres jobs de imagen) trae los runners
  # batch de catálogo vial y arancel —ya estaban en `1ec6bd6`, su ancestro— y además
  # `V28`…`V57`, `PublicarCuadros` y `PublicarParametros`.
  #
  # **Y volvió a quedarse atrás, exactamente igual (issue #675).** Entre el 2026-08-29 y
  # el 2026-09-02 entraron trece migraciones —`V58`…`V71`— y esta línea no se movió: la
  # versión declarada trae **48** y `main` declara **61**. `pulumi preview
  # --expect-no-changes` salía en verde todas las noches, porque compara el clúster con
  # lo declarado y no hay ninguna diferencia que ver: el Job lleva la versión en el
  # nombre, existe desde el último despliegue y nadie lo tocó.
  #
  # Aquí duele más que en `stg` por un motivo distinto: `aplicar-prod` tiene
  # `needs: aplicar-stg`, y `aplicar-stg` estaba rojo desde el 2026-08-30 por la
  # extensión `postgis` que falta, así que **prod no se despliega desde el 2026-08-29** y
  # el paso «El ambiente aplicado se comprueba a sí mismo», que se añadió al día
  # siguiente, **no se ha ejecutado nunca contra producción**. Por eso ese guion pasa a
  # correr también en `deteccion-de-deriva`, que sí corre a diario.
  #
  # Lo llevaba una persona hasta el 2026-09-02, y ese dia se midio lo que costaba:
  # **cuatro** PR de dos lineas en hora y media (#705, #715, #717, #719), y el tercero
  # obsoleto durante su propio CI porque otra migracion entro mientras corria.
  # La municipalidad que se implanta. D-01 —municipalidad piloto— se decidió el
  # 2026-08-24: Municipalidad Distrital de Catacaos (`decisiones-abiertas.md`), en
  # reemplazo de la Municipalidad Distrital de Chala que se había decidido un día antes.
  # El validador funcional de reglas tributarias, la otra mitad de D-01, sigue sin
  # nombrarse. El administrador NO lleva contraseña: la credencial vive en Keycloak y
  # esta cuenta tiene que ser la misma que exista allí.
  kamayuk:ubigeo: "200105"
  kamayuk:municipalidad: Municipalidad Distrital de Catacaos
  kamayuk:tipoDeMunicipalidad: DISTRITAL
  kamayuk:administrador: administrador
  kamayuk:nombreDelAdministrador: Administrador del sistema
  # El `id` de la fila que crea el Job de implantacion, y que los procesos por lotes de
  # los cuatro sistemas fijan como contexto de tenant (C-14 §3). `municipalidad.id` es
  # una columna `IDENTITY`: en una base recien creada vale 1 por construccion. Se declara
  # y no se deriva —componer manifiestos no habla con ninguna base—, y por eso
  # `checkInvariants` solo puede exigir que sea un entero mayor que cero.
  kamayuk:municipalidadId: "1"
  # Decidido a mano, que es lo que exige el issue #150. Vale `true` mientras D-02a esté
  # abierta: toda cifra que el sistema calcule hoy sale de tramos y alícuotas que nadie
  # ha firmado, y una instalación que emite documentos con esas cifras tiene que decir
  # lo que es. Ponerlo en `false` es el acto deliberado que cierra la marcha blanca, y
  # solo corresponde cuando D-02a esté cerrada.
  kamayuk:esDemostracion: "true"
  # El RPO de RNF-076, escrito. El destino está FUERA del VPS (INF-01 §1.3).
  # AWS S3 (issue #158, decision de 2026-08-24). us-east-1: es donde vive el bucket.
  kamayuk:backupEndpoint: https://s3.us-east-1.amazonaws.com
  kamayuk:backupRegion: us-east-1
  kamayuk:backupBucket: sgtm-prod-respaldos
  kamayuk:walArchiveTimeoutSeconds: "300"
  # A donde Alertmanager avisa (issue #156). Obligatorio en prod: `config.ts` se pone
  # rojo sin él —«una regla que no notifica a nadie no es una alerta»—. ⚠ PROVISIONAL:
  # el receptor real —Slack, correo, PagerDuty— se decide con el patrocinador; este
  # valor solo fija que la variable exista.
  kamayuk:alertWebhookUrl: https://hooks.example.pe/kamayuk-alertas
