# La interfaz y el reenvio a la API, en el mismo origen.
#
# Que `/api/v1` se sirva desde aqui no es comodidad: es lo que hace que el
# navegador nunca hable con el backend directamente, y por tanto que no haya CORS
# que configurar ni un segundo origen que autorizar en Keycloak. Una configuracion
# de CORS permisiva es de las cosas que se ponen «temporalmente» y se quedan.
#
# El backend, ademas, NO TIENE NINGUNA configuracion de CORS: un preflight desde
# otro origen sale 401 sin una sola cabecera `Access-Control-*`. De modo que esto
# no es una comodidad que se pueda quitar: es lo unico que hace que la interfaz
# alcance la API.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # La aplicacion resuelve sus rutas en el navegador —viven en el hash,
    # `#/catastro/predios`— asi que cualquier ruta que no sea un archivo devuelve
    # index.html. Sin esto, recargar en una ruta que no existe como archivo da un
    # 404 de nginx en vez de la pantalla.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/v1/ {
        proxy_pass http://aplicacion:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Los archivos con huella en el nombre no cambian nunca; index.html si. Sin
    # esta pareja el navegador decide por su cuenta, y entonces unas veces vuelve
    # a descargar activos con huella que no cambian y otras se queda con un
    # index.html viejo que apunta a activos que ya no existen.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
