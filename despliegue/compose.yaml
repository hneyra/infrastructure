# Marcha blanca del SGTM: motor, migracion y aplicacion, en ese orden.
#
# El orden es la parte que importa, y no es una preferencia de arranque:
#
#   base ──(sana)──► migraciones ──(termina con exito)──► aplicacion
#
# El motor crea los roles al inicializarse, porque un rol no puede crearse a si
# mismo y las politicas de V6__rls.sql los nombran. El migrador aplica el esquema
# como sgtm_owner y TERMINA. Solo entonces arranca la aplicacion, que se conecta
# como sgtm_app y no tiene DDL (ARQ-03 §4).
#
# Un esquema a medias con la aplicacion ya sirviendo peticiones es el estado que
# este orden existe para impedir.
#
# Las claves no estan aqui: salen de un archivo .env que no se versiona. Ver
# .env.ejemplo y el README de esta carpeta.

name: sgtm

services:
  base:
    # La misma PostgreSQL 16 con PostGIS dentro (ADR-0021): `crear-roles.sql`
    # instala la extension antes de la primera migracion, y la imagen oficial no
    # la trae —con ella el arranque falla con «extension "postgis" is not
    # available»—. Mismo volumen de datos, ninguna migracion de por medio.
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_DB: sgtm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${KAMAYUK_CLAVE_SUPERUSUARIO:?falta KAMAYUK_CLAVE_SUPERUSUARIO en .env}
      # Las lee el guion de asignacion de claves. El superusuario es el unico que
      # puede asignarlas, y solo existe en este contenedor.
      KAMAYUK_CLAVE_OWNER: ${KAMAYUK_CLAVE_OWNER:?falta KAMAYUK_CLAVE_OWNER en .env}
      KAMAYUK_CLAVE_APP: ${KAMAYUK_CLAVE_APP:?falta KAMAYUK_CLAVE_APP en .env}
      # rol_carga_parametros (issue #387): la unica credencial de publicar-parametros.sh
      # y publicar-cuadros.sh. Sin ella el guion de asignacion de claves no arranca.
      KAMAYUK_CLAVE_CARGA: ${KAMAYUK_CLAVE_CARGA:?falta KAMAYUK_CLAVE_CARGA en .env}
    volumes:
      # Los dos guiones de inicializacion corren en orden alfabetico, una sola vez,
      # cuando el volumen esta vacio. `crear-roles.sql` se monta desde el modulo del
      # esquema en lugar de copiarse aqui: una copia seria un segundo sitio donde
      # olvidar que el rol no puede ser superusuario.
      - ../backend/sgtm-esquema/src/main/resources/db/roles/crear-roles.sql:/docker-entrypoint-initdb.d/10-crear-roles.sql:ro
      - ./inicializacion-del-motor/20-asignar-claves.sh:/docker-entrypoint-initdb.d/20-asignar-claves.sh:ro
      - datos:/var/lib/postgresql/data
    healthcheck:
      # `--host=127.0.0.1` NO es decorativo: sin el, `pg_isready` pregunta por el
      # socket unix, y durante la fase de inicializacion del entrypoint el motor
      # arranca con `listen_addresses=''` —escucha por socket y NO por TCP—. Asi que
      # el contenedor se declaraba sano mientras todavia corrian los guiones de
      # initdb, y `migraciones`, que entra por TCP, se estrellaba con «Connection
      # refused». Era una carrera latente que gano el socket hasta que PostGIS
      # alargo el arranque —crea `template_postgis` y le carga las extensiones— y
      # entonces la perdio siempre. La sonda tiene que comprobar lo que sus
      # dependientes necesitan, no otra cosa parecida.
      test: ["CMD-SHELL", "pg_isready --host=127.0.0.1 --username=postgres --dbname=sgtm"]
      interval: 2s
      timeout: 3s
      retries: 40

  correo:
    # Atrapa el correo que Keycloak envia: el enlace de un solo uso para fijar la
    # clave en el alta declarativa de usuarios (ADR-0012, `execute-actions-email`
    # con UPDATE_PASSWORD). No sale de aqui —es un buzon de marcha blanca—; la
    # bandeja queda en http://localhost:${KAMAYUK_PUERTO_CORREO:-8025}.
    image: axllent/mailpit:v1.20
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "${KAMAYUK_PUERTO_CORREO:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 3s
      timeout: 3s
      retries: 20

  identidad:
    # Keycloak emite los tokens (ADR-0005). `start-dev` es lo correcto para una
    # marcha blanca —HTTP en claro detras del proxy, sin cluster— y lo incorrecto
    # para produccion, donde va `start` con TLS y su propia base.
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    # El realm trae `smtpServer` apuntando al buzon `correo`. Keycloak no lo
    # necesita para arrancar —solo al enviar el enlace de clave—, asi que basta con
    # que el servicio exista.
    depends_on:
      correo:
        condition: service_started
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KAMAYUK_KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KAMAYUK_CLAVE_KEYCLOAK:?falta KAMAYUK_CLAVE_KEYCLOAK en .env}
      KC_HEALTH_ENABLED: "true"
      # El emisor que Keycloak pone en el `iss` de cada token tiene que ser el
      # mismo que el backend valida y el mismo al que el navegador va. Con dos
      # nombres distintos —uno de red interna, otro del anfitrion— la firma valida
      # y el emisor no cuadra, y el 401 no dice por que.
      KC_HOSTNAME: ${KAMAYUK_OIDC_EMISOR:-http://localhost:8180}
      KC_HOSTNAME_STRICT: "false"
    volumes:
      - ./identidad/realm-sgtm.json:/opt/keycloak/data/import/realm-sgtm.json:ro
      # El realm del CIUDADANO (ADR-0020). Dos archivos y dos realms, no dos
      # clientes de uno: son **dos emisores**, y es lo que separa a las dos
      # poblaciones estructuralmente —el backend monta dos cadenas de seguridad,
      # cada una validando contra uno, asi que un token de funcionario no
      # autentica en `/portal/**` ni al reves—. Con un solo emisor, lo unico que
      # las separaria seria un `if` dentro de la aplicacion.
      - ./identidad/realm-sgtm-ciudadano.json:/opt/keycloak/data/import/realm-sgtm-ciudadano.json:ro
    ports:
      - "${KAMAYUK_PUERTO_IDENTIDAD:-8180}:8080"
    # Sin healthcheck, y no por descuido: la imagen de Keycloak no trae curl ni
    # wget, y las recetas que circulan para sortearlo dependen de que el shell del
    # contenedor sea bash. Aqui no hace falta ninguna, porque la aplicacion NO
    # necesita a Keycloak para arrancar: con `jwk-set-uri` configurado, el decoder
    # se construye sin descubrimiento y las claves se piden la primera vez que
    # llega un token. Quien si tiene que esperarlo es quien vaya a pedir uno, y eso
    # se espera desde fuera —ver el README y el trabajo de despliegue—.

  migraciones:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      target: migrador
    depends_on:
      base:
        condition: service_healthy
    environment:
      KAMAYUK_DB_URL: jdbc:postgresql://base:5432/sgtm
      KAMAYUK_DB_OWNER_USUARIO: sgtm_owner
      KAMAYUK_DB_OWNER_CLAVE: ${KAMAYUK_CLAVE_OWNER:?falta KAMAYUK_CLAVE_OWNER en .env}
    # Corre y termina. Si se reinicia, vuelve a comprobar el ambiente y no aplica
    # nada: el migrador es idempotente y tiene su prueba que lo demuestra.
    restart: "no"

  aplicacion:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      target: aplicacion
    # Nombre fijo para la imagen construida. Sin el, Docker le pone uno derivado
    # del proyecto y del servicio, y la verificacion que arranca esta misma imagen
    # a mano —sin emisor, para comprobar que se niega— tendria que adivinarlo.
    image: sgtm-aplicacion:marcha-blanca
    depends_on:
      implantacion:
        condition: service_completed_successfully
      identidad:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: web
      # Sin esta variable la aplicacion NO arranca, y es deliberado: un backend que
      # atiende peticiones sin poder validar un token es la situacion que ADR-0005
      # excluye. El valor tiene que coincidir con el `iss` que emite Keycloak.
      KAMAYUK_OIDC_EMISOR: ${KAMAYUK_OIDC_EMISOR:-http://localhost:8180}/realms/sgtm
      # De donde se traen las claves. Dentro de la red del compose, Keycloak es
      # `identidad:8080`; `localhost:8180` es el nombre por el que llega el
      # navegador, y dentro de este contenedor apuntaria a este mismo proceso.
      KAMAYUK_OIDC_JWKS: http://identidad:8080/realms/sgtm/protocol/openid-connect/certs
      # El emisor del realm del CIUDADANO (ADR-0020). A diferencia del de arriba,
      # este SI admite estar vacio: una instalacion sin portal del contribuyente
      # es legitima, y entonces la cadena de `/api/v1/portal/**` lo niega todo.
      # Lo que no puede pasar —y por eso la cadena se registra igual— es que esas
      # rutas caigan en la cadena general y queden servidas contra el emisor de
      # funcionarios.
      KAMAYUK_PORTAL_OIDC_EMISOR: ${KAMAYUK_OIDC_EMISOR:-http://localhost:8180}/realms/sgtm-ciudadano
      KAMAYUK_PORTAL_OIDC_JWKS: http://identidad:8080/realms/sgtm-ciudadano/protocol/openid-connect/certs
      KAMAYUK_DB_URL: jdbc:postgresql://base:5432/sgtm
      # sgtm_app y solo sgtm_app. Poner aqui las credenciales de sgtm_owner
      # —«para que migre al arrancar», «para una carga rapida»— le daria DDL sobre
      # el padron de todas las municipalidades a un proceso expuesto en HTTP. La
      # verificacion de despliegue comprueba exactamente esto y se pone roja.
      KAMAYUK_DB_USUARIO: sgtm_app
      KAMAYUK_DB_CLAVE: ${KAMAYUK_CLAVE_APP:?falta KAMAYUK_CLAVE_APP en .env}
    ports:
      - "${KAMAYUK_PUERTO:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/actuator/health || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 30s

  # Corre y termina, como el migrador, y por el mismo motivo: es implantacion, no
  # servicio. Usa la MISMA imagen que la aplicacion —un solo artefacto, ADR-0003—
  # con el perfil batch, asi que no abre puerto ninguno.
  #
  # Es el unico sitio, ademas del migrador, donde entran las credenciales de
  # sgtm_owner: las necesita para UNA sentencia sobre `municipalidad`, que es la
  # unica tabla que sgtm_app no puede escribir. Todo lo demas lo hace como
  # sgtm_app y con su auditoria.
  implantacion:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      target: aplicacion
    depends_on:
      migraciones:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: batch
      KAMAYUK_DB_URL: jdbc:postgresql://base:5432/sgtm
      KAMAYUK_DB_USUARIO: sgtm_app
      KAMAYUK_DB_CLAVE: ${KAMAYUK_CLAVE_APP:?falta KAMAYUK_CLAVE_APP en .env}
      KAMAYUK_IMPLANTACION_UBIGEO: ${KAMAYUK_UBIGEO:?falta KAMAYUK_UBIGEO en .env}
      KAMAYUK_IMPLANTACION_NOMBRE: ${KAMAYUK_MUNICIPALIDAD:?falta KAMAYUK_MUNICIPALIDAD en .env}
      KAMAYUK_IMPLANTACION_TIPO: ${KAMAYUK_TIPO_DE_MUNICIPALIDAD:-DISTRITAL}
      # La cuenta TIENE que ser la misma que el usuario de Keycloak: es lo unico
      # que une la fila de `usuario` con la identidad del token (ADR-0005). Para no
      # tener que cuidarlo a mano, estas dos salen del archivo versionado de la
      # municipalidad: `./identidad/datos-de-implantacion.sh <ubigeo> >> .env`
      # (ADR-0012).
      KAMAYUK_IMPLANTACION_ADMINISTRADOR: ${KAMAYUK_ADMINISTRADOR:?falta KAMAYUK_ADMINISTRADOR en .env (ver identidad/datos-de-implantacion.sh)}
      KAMAYUK_IMPLANTACION_NOMBREDELADMINISTRADOR: ${KAMAYUK_NOMBRE_DEL_ADMINISTRADOR:-Administrador del sistema}
      # Mientras D-02a este abierta, toda cifra que el sistema calcule sale de
      # parametros que nadie ha firmado. Una instalacion declarada de demostracion
      # marca TODO documento que emita, en los tres formatos (#122).
      #
      # El valor por omision es `true`, al reves que en el codigo, y a proposito: aqui
      # se levanta una marcha blanca. Una instalacion de verdad tiene que decir que lo
      # es, y decirlo es un cambio que se ve en su .env.
      #
      # Solo se aplica al ALTA: relanzar el despliegue con `false` no le quita la marca
      # a una municipalidad ya implantada. Quitarla es un UPDATE deliberado de
      # sgtm_owner, que deja rastro de quien lo hizo.
      KAMAYUK_IMPLANTACION_ESDEMOSTRACION: ${KAMAYUK_ES_DEMOSTRACION:-true}
      KAMAYUK_IMPLANTACION_URL: jdbc:postgresql://base:5432/sgtm
      # OWNERCLAVE sin guion bajo: en una variable de entorno el `_` se traduce a
      # punto, asi que KAMAYUK_IMPLANTACION_OWNER_CLAVE seria la propiedad
      # `kamayuk.implantacion.owner.clave` y no `owner-clave`. Los guiones del nombre
      # de la propiedad, en cambio, simplemente se quitan.
      KAMAYUK_IMPLANTACION_OWNERCLAVE: ${KAMAYUK_CLAVE_OWNER:?falta KAMAYUK_CLAVE_OWNER en .env}
    restart: "no"

  interfaz:
    build:
      context: ../frontend
      args:
        # Vite resuelve esta variable AL COMPILAR: no es configuracion de
        # ejecucion y cambiarla exige reconstruir la imagen. Es la consecuencia de
        # servir archivos estaticos, y conviene saberla antes de buscar por que un
        # cambio en el .env no se nota.
        #
        # Las de la puerta de sesion no se pasan: sus valores por omision en el
        # Dockerfile —`/kc/realms/sgtm` y `sgtm-backoffice`— ya son los de este
        # despliegue, y son RUTAS del mismo origen. Escribir aqui el dominio las
        # hornearia en el paquete estatico, que es justo lo que no se quiere.
        VITE_KAMAYUK_API: /api/v1
    depends_on:
      aplicacion:
        condition: service_healthy
    ports:
      - "${KAMAYUK_PUERTO_INTERFAZ:-8081}:8080"
    healthcheck:
      # 127.0.0.1 y no `localhost`: el guion de arranque de la imagen solo anade el
      # `listen [::]:8080` cuando la configuracion es la suya, y esta no lo es, asi
      # que nginx escucha SOLO en IPv4. Con `localhost`, wget resuelve ::1 primero,
      # no encuentra a nadie y el contenedor se queda «unhealthy» para siempre con
      # nginx sirviendo perfectamente al lado.
      test: ["CMD-SHELL", "wget --quiet --output-document=/dev/null http://127.0.0.1:8080/"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  datos:
